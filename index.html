<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教練課預約系統</title>
  <link rel="stylesheet" href="style.css">
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

  <div id="app" class="pixel-box">
    <!-- 頂部導覽區 -->
    <div class="top-header">
      <div id="user-greeting" style="font-size: 18px; font-weight: bold;">讀取中...</div>
      <button class="pixel-btn" id="toggle-all-btn" onclick="toggleAllBlocks()">全部收納</button>
    </div>

    <!-- 學生檢視視角 -->
    <div id="student-view" style="display: none;">
      <!-- 教練簡介連結區 -->
      <div class="pixel-box" style="background: #e7f5ff; cursor: pointer;" onclick="openTrainerModal()">
        <span id="coach-name-tag" style="font-weight: bold; color: #1c7ed6;">教練資訊載入中...</span>
      </div>

      <!-- 第一區塊：最近一期上課資訊 -->
      <details class="pixel-block" open>
        <summary>
          <span>📅 1. 最近一期上課時間與地點</span>
          <span class="badge">最新預約</span>
        </summary>
        <div class="block-content" id="next-class-info">
          <!-- 動態渲染近一期時間/地點/行事曆狀態 -->
        </div>
      </details>

      <!-- 第二區塊：期數與剩餘堂數 -->
      <details class="pixel-block" open>
        <summary>
          <span>📊 2. 課程期數與堂數狀況</span>
        </summary>
        <div class="block-content" id="packages-list">
          <!-- 動態渲染期數狀態，扣課永遠由最早開始扣 -->
        </div>
      </details>

      <!-- 第三區塊：提出 Top 3 預約時間 -->
      <details class="pixel-block" open>
        <summary>
          <span>⏰ 3. 預約最近 30 天上課 (Top 3 志願)</span>
        </summary>
        <div class="block-content">
          <p style="font-size: 13px; color: #666;">請選擇近 30 天內最希望上課的三個時間段：</p>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <input type="datetime-local" id="slot-1" class="pixel-box">
            <input type="datetime-local" id="slot-2" class="pixel-box">
            <input type="datetime-local" id="slot-3" class="pixel-box">
            <button class="pixel-btn" style="background: #51cf66;" onclick="submitBookingRequest()">提交教練確認</button>
          </div>
        </div>
      </details>

      <!-- 第四區塊：歷史上課紀錄 -->
      <details class="pixel-block" open>
        <summary>
          <span>📜 4. 上課歷史紀錄</span>
        </summary>
        <div class="block-content" id="class-history-list">
          <!-- 動態渲染歷史紀錄 -->
        </div>
      </details>
    </div>

    <!-- 教練管理視角 -->
    <div id="trainer-view" style="display: none;">
      <h3>💪 教練管理主頁面</h3>
      <div id="pending-requests" class="pixel-box" style="background: #fff9db;">
        <h4>待確認的學員 Top 3 約課請求</h4>
        <div id="requests-container"></div>
      </div>

      <div class="pixel-box">
        <h4>學員列表與期數維護</h4>
        <div id="student-management-list"></div>
      </div>
    </div>
  </div>

  <script>
    let allExpanded = true;
    let currentUserId = "";
    let dbData = {};

    // 1. 初始化 LINE LIFF 與用戶路由
    async function initLiff() {
      try {
        await liff.init({ liffId: "2011857437-xFUbKdAg" });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        currentUserId = profile.userId;
        
        await loadGitHubDB();
        routeUser(currentUserId);
      } catch (err) {
        console.error("LIFF 初始化失敗或測試模式", err);
        // 本地測試備用 ID
        currentUserId = "U9876543210fedcba";
        await loadGitHubDB();
        routeUser(currentUserId);
      }
    }

    // 2. 從 GitHub 儲存庫讀取 JSON DB
    async function loadGitHubDB() {
      // 可使用 Raw GitHub 網址或 GitHub API 讀取
      const response = await fetch('https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/YOUR_REPO/main/data/db.json');
      dbData = await response.json();
    }

    // 3. 用戶身分路由 (學員 vs 教練)
    function routeUser(lineId) {
      const student = dbData.students.find(s => s.line_user_id === lineId);
      const trainer = dbData.trainers.find(t => t.line_user_id === lineId);

      if (student) {
        renderStudentView(student);
      } else if (trainer) {
        renderTrainerView(trainer);
      } else {
        // 新學員導向建立資料註冊流程
        renderOnboardingForm(lineId);
      }
    }

    // 4. 渲染學員專屬視角
    function renderStudentView(student) {
      document.getElementById('student-view').style.display = 'block';
      
      // 抬頭學生名稱
      document.getElementById('user-greeting').innerHTML = `
        嗨！<span style="color: var(--pixel-primary); cursor: pointer;" onclick="openStudentProfileModal('${student.id}')">${student.name} 👤</span>
      `;

      // 抬頭第二行教練資訊
      const coach = dbData.trainers.find(t => t.id === student.trainer_id);
      document.getElementById('coach-name-tag').innerText = `🏋️ 專屬教練：${coach ? coach.nickname || coach.name : '未指定'}`;

      // 區塊 1：最近一期預約
      const nextLog = dbData.class_logs.filter(l => l.student_id === student.id && l.status === 'scheduled')[0];
      document.getElementById('next-class-info').innerHTML = nextLog ? `
        <p><strong>時間：</strong> ${nextLog.datetime}</p>
        <p><strong>地點：</strong> ${nextLog.location}</p>
        <p><strong>Google 行事曆狀態：</strong> ${nextLog.added_to_google_calendar ? '✅ 已同步' : '❌ 未同步'}</p>
      ` : '<p style="color: #888;">近期無已確認的課程，請於下方提交預約時間！</p>';

      // 區塊 2：期數與剩餘堂數 (依期數排序)
      const packages = dbData.packages
        .filter(p => p.student_id === student.id && p.status === 'active')
        .sort((a, b) => a.term_number - b.term_number);

      let pkgHtml = '';
      packages.forEach(p => {
        pkgHtml += `
          <div class="pixel-box" style="margin-bottom: 8px;">
            <div style="display:flex; justify-content:space-between;">
              <strong>第 ${p.term_number} 期</strong>
              <span class="badge" style="background:#40c057;">剩餘 ${p.remaining_lessons} / ${p.total_lessons} 堂</span>
            </div>
            <div style="font-size: 12px; color: #666; margin-top: 4px;">付款方式: ${p.payment_method} (${p.payment_date})</div>
          </div>
        `;
      });
      document.getElementById('packages-list').innerHTML = pkgHtml || '<p>尚無有效期數</p>';

      // 區塊 4：歷史紀錄
      const historyLogs = dbData.class_logs.filter(l => l.student_id === student.id && l.status === 'completed');
      document.getElementById('class-history-list').innerHTML = historyLogs.map(h => `
        <div style="border-bottom: 1px dashed #ccc; padding: 6px 0;">
          🕒 ${h.datetime} - ${h.location} (完成)
        </div>
      `).join('') || '<p style="color: #888;">尚無完成的上課紀錄</p>';
    }

    // 5. 控制『全部展開/收納』
    function toggleAllBlocks() {
      const blocks = document.querySelectorAll('.pixel-block');
      allExpanded = !allExpanded;
      blocks.forEach(b => {
        if (allExpanded) {
          b.setAttribute('open', '');
        } else {
          b.removeAttribute('open');
        }
      });
      document.getElementById('toggle-all-btn').innerText = allExpanded ? '全部收納' : '全部展開';
    }

    // 初始化執行
    initLiff();
  </script>
</body>
</html>
