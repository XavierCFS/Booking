<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教練預約</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--sub:#6e6e73;--ln:#e5e5ea;--ac:#0071e3;--ok:#34c759;--bad:#ff3b30}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--sub:#98989d;--ln:#38383a;--ac:#2997ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-.02em}
.link{background:none;border:0;color:var(--ac);font:inherit;font-size:15px;cursor:pointer;padding:6px 0}
details.blk{background:var(--card);border-radius:16px;margin-bottom:12px;overflow:hidden}
details.blk details.blk{background:var(--bg);border-radius:12px;margin:8px 0 0}
summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(-45deg);transition:transform .2s;flex:none}
details[open]>summary::after{transform:rotate(45deg)}
summary small{color:var(--sub);font-weight:400;margin-left:auto}
.bd{padding:0 16px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--ln)}
.row:first-child{border-top:0}
.row span:first-child{color:var(--sub)}
.sub{color:var(--sub);font-size:14px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--sub)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;font:inherit;font-weight:600;padding:11px 16px;cursor:pointer;width:100%}
.btn.s{width:auto;padding:6px 12px;font-size:14px;border-radius:999px}
.btn.g{background:var(--bg);color:var(--ac)}
.btn.r{background:var(--bg);color:var(--bad)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--sub)}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--ln)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
a{color:var(--ac);text-decoration:none}
.sw{display:flex;justify-content:space-between;align-items:center}
.sw input{width:auto;margin:0}
footer{margin:24px 0;text-align:center;font-size:13px;color:var(--sub)}
.empty{color:var(--sub);padding:6px 0}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== 設定 ===== */
const CONFIG = { LIFF_ID: "" };  // 填入 LINE LIFF ID；留空 = 示範模式（資料存在本機瀏覽器）

/* ===== 資料層：目前用 localStorage；正式上線請把 load/save 換成 Firebase / Supabase ===== */
const blank = () => ({coach:null, students:{}, packages:[], lessons:[], requests:[], notes:[], cfg:{maxDays:30, place:""}});
const store = {
  load(){ try{ return JSON.parse(localStorage.getItem("cb_db")) || blank(); }catch(e){ return blank(); } },
  save(db){ localStorage.setItem("cb_db", JSON.stringify(db)); }
};
let db = store.load(), S = {uid:null, coachMode:false, demo:!CONFIG.LIFF_ID};

/* ===== 工具 ===== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
const rid = () => Math.random().toString(36).slice(2, 10);
const fmt = d => new Date(d).toLocaleString("zh-TW", {month:"numeric", day:"numeric", weekday:"short", hour:"2-digit", minute:"2-digit", hour12:false});
const loc = d => { const o = new Date(d - d.getTimezoneOffset() * 6e4); return o.toISOString().slice(0, 16); };
const gcal = l => { const z = x => new Date(x).toISOString().replace(/[-:]|\.\d{3}/g, "");
  const e = new Date(+new Date(l.start) + 36e5);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent("教練課")}&dates=${z(l.start)}/${z(e)}&location=${encodeURIComponent(l.place || "")}`; };
const commit = () => { store.save(db); render(); };

/* 期數與扣課：已完成的課從最早的期數開始扣 */
function stats(sid){
  let done = db.lessons.filter(l => l.sid === sid && l.status === "done").sort((a, b) => a.start.localeCompare(b.start));
  return db.packages.filter(p => p.sid === sid).sort((a, b) => a.term - b.term).map(p => {
    const used = done.slice(0, p.total); done = done.slice(p.total);
    return {...p, used, remain: p.total - used.length};
  });
}
const remainOf = sid => stats(sid).reduce((n, p) => n + p.remain, 0);

/* ===== 元件 ===== */
const blk = (k, title, body, right = "") => `<details class="blk" data-k="${k}"><summary>${title}${right ? `<small>${right}</small>` : ""}</summary><div class="bd">${body}</div></details>`;
const rows = a => a.map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join("");
const top = t => `<div class="top"><h1>${t}</h1><button class="link" data-act="toggleAll">全部展開/收納</button></div>`;
const field = (n, l, t = "text", v = "", x = "") => `<label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${x}>`;
const gender = v => `<label>生理性別</label><select name="gender"><option ${v === "男" ? "selected" : ""}>男</option><option ${v === "女" ? "selected" : ""}>女</option></select>`;

/* ===== 學員端 ===== */
function onboardStudent(){
  return `<div data-f class="card"><h1>歡迎</h1><p class="sub">第一次使用，請先建立個人資料。</p>
  ${field("name", "姓名", "text", S.lineName || "")}${field("phone", "電話", "tel")}${gender("")}${field("birthday", "生日", "date")}
  <div class="sw"><label>連動 Google 行事曆（可略過）</label><input type="checkbox" name="gcal"></div><br>
  <button class="btn" data-act="regStudent">建立資料</button></div>`;
}
function studentView(){
  const s = db.students[S.uid], c = db.coach, pk = stats(S.uid);
  const next = db.lessons.filter(l => l.sid === S.uid && l.status === "scheduled" && new Date(l.start) > Date.now() - 36e5).sort((a, b) => a.start.localeCompare(b.start))[0];
  const hist = db.lessons.filter(l => l.sid === S.uid && l.status === "done").sort((a, b) => b.start.localeCompare(a.start));
  const reqs = db.requests.filter(r => r.sid === S.uid && r.status === "pending");
  const now = new Date(), max = new Date(+now + db.cfg.maxDays * 864e5);
  return top(`嗨！${esc(s.name)}`) +
  blk("me", "個人資料", rows([["姓名", esc(s.name)], ["電話", esc(s.phone)], ["性別", s.gender], ["生日", s.birthday || "—"]]) +
    `<div class="row sw"><span>Google 行事曆連動</span><input type="checkbox" data-act="gcalToggle" ${s.gcal ? "checked" : ""}></div>`) +
  (c ? blk("coach", `${esc(c.nick || c.name)}教練`, `<div style="display:flex;gap:14px;align-items:center;margin-bottom:8px">${c.photo ? `<img class="av" src="${c.photo}" alt="">` : `<div class="av"></div>`}<div><b>${esc(c.name)}</b><div class="sub">${esc(c.nick)}・${c.gender}</div></div></div>${rows([["電話", esc(c.phone)]])}<p>${esc(c.bio)}</p>`) : "") +
  blk("next", "最近一堂課", next ? rows([["時間", fmt(next.start)], ["地點", esc(next.place || "待確認")]]) + `<div class="acts"><a class="btn s g" target="_blank" href="${gcal(next)}">加入 Google 行事曆</a></div>` : `<div class="empty">目前沒有已確認的課程</div>`, next ? fmt(next.start) : "") +
  blk("pk", "課程期數", pk.length ? pk.map(p => rows([[`第 ${p.term} 期`, `剩 ${p.remain} / 共 ${p.total} 堂`]])).join("") + `<p class="sub">扣課從最早的期數開始。</p>` : `<div class="empty">尚未購買期數</div>`, `剩 ${remainOf(S.uid)} 堂`) +
  blk("req", "我想約課", `<div data-f><p class="sub">最近 ${db.cfg.maxDays} 天內，提出 3 個想上課的時間，教練確認後才算正式課程。</p>` +
    [1, 2, 3].map(i => field("t" + i, "志願 " + i, "datetime-local", "", `min="${loc(now)}" max="${loc(max)}"`)).join("") +
    `<button class="btn" data-act="req">送出</button></div>` +
    (reqs.length ? `<h4>等待教練確認</h4>` + reqs.map(r => `<div class="row"><span>${r.times.map(fmt).join("<br>")}</span><span class="pill">待確認</span></div>`).join("") : "")) +
  blk("hist", "上課紀錄", hist.length ? hist.map(l => `<div class="row"><span>${fmt(l.start)}</span><span>${esc(l.place)}</span></div>`).join("") : `<div class="empty">還沒有上課紀錄</div>`, hist.length + " 堂");
}

/* ===== 教練端 ===== */
function onboardCoach(){
  return `<div data-f class="card"><h1>教練註冊</h1>
  <label>個人照</label><input name="photo" type="file" accept="image/*">
  ${field("name", "姓名")}${field("nick", "綽號")}${field("phone", "電話", "tel")}${gender("")}
  <label>個人經歷</label><textarea name="bio" rows="4"></textarea>
  <div class="sw"><label>連動 Google 行事曆</label><input type="checkbox" name="gcal" checked></div><br>
  <button class="btn" data-act="regCoach">完成註冊</button></div>`;
}
function coachView(){
  const c = db.coach;
  const up = db.lessons.filter(l => l.status === "scheduled").sort((a, b) => a.start.localeCompare(b.start));
  const pend = db.requests.filter(r => r.status === "pending");
  const sname = id => esc(db.students[id]?.name || "?");
  const cal = (pend.length ? `<h4>約課申請</h4>` + pend.map(r => `<div data-f data-rid="${r.id}"><b>${sname(r.sid)}</b>${field("place", "地點", "text", db.cfg.place)}<div class="acts">${r.times.map((t, i) => `<button class="btn s g" data-act="confirmReq" data-i="${i}">${fmt(t)}</button>`).join("")}<button class="btn s r" data-act="rejectReq">婉拒</button></div></div><hr>`).join("") : "") +
    `<h4>即將到來的課程</h4>` + (up.length ? up.map(l => `<div class="row"><span>${fmt(l.start)}<br><span class="sub">${sname(l.sid)}・${esc(l.place)}</span></span><span class="acts" data-id="${l.id}"><button class="btn s g" data-act="done">完課</button><button class="btn s r" data-act="cancel">取消</button></span></div>`).join("") : `<div class="empty">沒有預約</div>`);
  const stu = Object.entries(db.students).map(([id, s]) => {
    const pk = stats(id), notes = db.notes.filter(n => n.sid === id).sort((a, b) => b.ts - a.ts);
    return blk("s" + id, esc(s.name), rows([["電話", esc(s.phone)], ["性別", s.gender], ["生日", s.birthday || "—"]]) +
      `<h4>期數與繳費</h4>` + (pk.map(p => blk("p" + p.id, `第 ${p.term} 期`, rows([["教練費", "$" + p.fee], ["付款日期", p.paid], ["付款方式", esc(p.method)]]) + (p.used.length ? p.used.map(l => `<div class="row"><span>已上</span><span>${fmt(l.start)}</span></div>`).join("") : `<div class="empty">尚未上課</div>`), `剩 ${p.remain}/${p.total}`)).join("") || `<div class="empty">尚無期數</div>`) +
      `<div data-f data-sid="${id}"><h4>新增期數</h4>${field("fee", "教練費", "number")}${field("total", "堂數", "number")}${field("paid", "付款日期", "date", loc(new Date()).slice(0, 10))}${field("method", "付款方式", "text", "轉帳")}<button class="btn" data-act="addPkg">新增期數</button></div>` +
      `<div data-f data-sid="${id}"><h4>直接排課</h4>${field("start", "時間", "datetime-local")}${field("place", "地點", "text", db.cfg.place)}<button class="btn g" data-act="addLesson">排課</button></div>` +
      `<h4>備注</h4>` + notes.map(n => `<div class="row"><span>${esc(n.text)}</span><span class="sub">${new Date(n.ts).toLocaleDateString("zh-TW")}</span></div>`).join("") +
      `<div data-f data-sid="${id}"><textarea name="text" rows="2" placeholder="新增備注"></textarea><button class="btn g" data-act="addNote">新增備注</button></div>`, `剩 ${remainOf(id)} 堂`);
  }).join("") || `<div class="empty">還沒有學員。請學員從學員連結進入並建立資料。</div>`;
  return top(`${esc(c.nick || c.name)}教練`) +
    blk("cal", "課程預約", cal, `${up.length} 堂`) + blk("stu", "我的學員", stu, Object.keys(db.students).length + " 人") +
    blk("prof", "教練資料與設定", `<div data-f>${field("name", "姓名", "text", c.name)}${field("nick", "綽號", "text", c.nick)}${field("phone", "電話", "tel", c.phone)}<label>個人經歷</label><textarea name="bio" rows="4">${esc(c.bio)}</textarea>
    <label>個人照</label><input name="photo" type="file" accept="image/*">
    ${field("maxDays", "學員可預約的天數上限", "number", db.cfg.maxDays)}${field("place", "預設上課地點", "text", db.cfg.place)}
    <div class="sw"><label>Google 行事曆連動</label><input type="checkbox" name="gcal" ${c.gcal ? "checked" : ""}></div><br><button class="btn" data-act="saveCoach">儲存</button></div>`);
}

/* ===== 渲染 ===== */
function render(){
  const open = new Set([...document.querySelectorAll("details[open]")].map(d => d.dataset.k));
  let h;
  if (S.coachMode){
    if (!db.coach) h = onboardCoach();
    else if (db.coach.uid !== S.uid) h = `<div class="card"><h1>無法進入</h1><p class="sub">這個連結只提供教練使用。</p></div>`;
    else h = coachView();
  } else h = db.students[S.uid] ? studentView() : onboardStudent();
  if (S.demo) h += `<footer>示範模式（資料只存在這支瀏覽器）<br><a href="?">學員視角</a>・<a href="?role=coach">教練視角</a>・<a href="#" data-act="newStu">換成新學員</a>・<a href="#" data-act="reset">清除資料</a></footer>`;
  app.innerHTML = h;
  document.querySelectorAll("details").forEach(d => { if (open.has(d.dataset.k)) d.open = true; });
}

/* ===== 事件 ===== */
const rd = f => Object.fromEntries([...f.querySelectorAll("[name]")].map(i => [i.name, i.type === "checkbox" ? i.checked : i.value.trim()]));
const photoOf = file => new Promise(res => { if (!file) return res(null); const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"), k = 240 / Math.min(im.width, im.height); c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .8)); }; im.src = r.result; }; r.readAsDataURL(file); });

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || b.type === "checkbox") return;
  const a = b.dataset.act, f = b.closest("[data-f]"), d = f ? rd(f) : {}, sid = f?.dataset.sid, id = b.closest("[data-id]")?.dataset.id;
  if (a === "toggleAll"){ const all = [...document.querySelectorAll("details")]; const any = all.some(x => !x.open); all.forEach(x => x.open = any); return; }
  if (a === "newStu"){ e.preventDefault(); localStorage.cb_uid = "U" + rid(); location.href = "?"; return; }
  if (a === "reset"){ e.preventDefault(); if (confirm("確定清除所有示範資料？")){ localStorage.clear(); location.href = "?"; } return; }
  const need = (...k) => k.every(x => d[x]) || (alert("請填寫完整"), false);
  if (a === "regStudent"){ if (!need("name", "phone", "birthday")) return; db.students[S.uid] = {name: d.name, phone: d.phone, gender: d.gender, birthday: d.birthday, gcal: d.gcal}; }
  if (a === "regCoach"){ if (!need("name", "phone")) return; db.coach = {uid: S.uid, name: d.name, nick: d.nick, phone: d.phone, gender: d.gender, bio: d.bio, gcal: d.gcal, photo: await photoOf(f.querySelector("[name=photo]").files[0])}; }
  if (a === "saveCoach"){ const p = await photoOf(f.querySelector("[name=photo]").files[0]); Object.assign(db.coach, {name: d.name, nick: d.nick, phone: d.phone, bio: d.bio, gcal: d.gcal}); if (p) db.coach.photo = p; db.cfg.maxDays = +d.maxDays || 30; db.cfg.place = d.place; }
  if (a === "req"){ const t = [d.t1, d.t2, d.t3].filter(Boolean); if (t.length < 3) return alert("請填滿 3 個時間"); db.requests.push({id: rid(), sid: S.uid, times: t.map(x => new Date(x).toISOString()), status: "pending"}); }
  if (a === "confirmReq"){ const r = db.requests.find(x => x.id === f.dataset.rid); r.status = "confirmed"; db.lessons.push({id: rid(), sid: r.sid, start: r.times[+b.dataset.i], place: d.place, status: "scheduled"}); }
  if (a === "rejectReq"){ db.requests.find(x => x.id === f.dataset.rid).status = "rejected"; }
  if (a === "addLesson"){ if (!need("start")) return; db.lessons.push({id: rid(), sid, start: new Date(d.start).toISOString(), place: d.place, status: "scheduled"}); }
  if (a === "done"){ db.lessons.find(l => l.id === id).status = "done"; }
  if (a === "cancel"){ db.lessons = db.lessons.filter(l => l.id !== id); }
  if (a === "addPkg"){ if (!need("fee", "total", "paid")) return; db.packages.push({id: rid(), sid, term: db.packages.filter(p => p.sid === sid).length + 1, fee: +d.fee, total: +d.total, paid: d.paid, method: d.method}); }
  if (a === "addNote"){ if (!need("text")) return; db.notes.push({sid, text: d.text, ts: Date.now()}); }
  commit();
});
document.addEventListener("change", e => {
  if (e.target.dataset.act === "gcalToggle"){ db.students[S.uid].gcal = e.target.checked; commit(); }
});

/* ===== 啟動 ===== */
(async function init(){
  S.coachMode = /role(=|%3D)coach/.test(location.href);
  try{
    if (CONFIG.LIFF_ID){
      await liff.init({liffId: CONFIG.LIFF_ID});
      if (!liff.isLoggedIn()){ liff.login(); return; }
      const p = await liff.getProfile(); S.uid = p.userId; S.lineName = p.displayName;
    }
  }catch(err){ console.error(err); }
  if (!S.uid) S.uid = new URLSearchParams(location.search).get("uid") || localStorage.cb_uid || (localStorage.cb_uid = "U" + rid());
  render();
})();
</script>
</body>
</html>
