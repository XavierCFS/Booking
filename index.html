<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教練課預約工具</title>
  <link rel="stylesheet" href="style.css">
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* 彈出視窗 (Modal) 像素風格 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff;
      border: 4px solid #222;
      box-shadow: 6px 6px 0px #222;
      padding: 20px;
      width: 90%; max-width: 420px;
      max-height: 90vh; overflow-y: auto;
    }
    .form-group {
      margin-bottom: 12px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .form-group label {
      font-weight: bold; font-size: 14px;
    }
    .form-input {
      padding: 8px; border: 3px solid #222;
      font-size: 14px; background: #fafafa;
    }
  </style>
</head>
<body>

  <div id="app" class="pixel-box">
    <!-- 頂部導覽區與「全部展開/收納」按鈕 -->
    <div class="top-header">
      <div id="user-greeting" style="font-size: 18px; font-weight: bold;">資料載入中...</div>
      <button class="pixel-btn" id="toggle-all-btn" onclick="toggleAllBlocks()">全部收納</button>
    </div>

    <!-- 1. 新學員首訪註冊表單區塊 -->
    <div id="register-view" class="pixel-box" style="display: none; background: #e7f5ff;">
      <h3 style="margin-top: 0; color: #1c7ed6;">📝 歡迎首次體驗！請建立個人資料</h3>
      <p style="font-size: 13px; color: #555;">填寫完成後即可開始與專屬教練約課：</p>
      
      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" id="reg-name" class="form-input" required placeholder="例如：王小明">
        </div>

        <div class="form-group">
          <label>電話號碼 *</label>
          <input type="tel" id="reg-phone" class="form-input" required placeholder="例如：0912345678">
        </div>

        <div class="form-group">
          <label>生理性別 *</label>
          <select id="reg-gender" class="form-input" required>
            <option value="male">男</option>
            <option value="female">女</option>
            <option value="other">其他</option>
          </select>
        </div>

        <div class="form-group">
          <label>生日 *</label>
          <input type="date" id="reg-birthday" class="form-input" required>
        </div>

        <div class="form-group">
          <label>選擇你的專屬教練 *</label>
          <select id="reg-trainer" class="form-input" required></select>
        </div>

        <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px; margin-top: 8px;">
          <input type="checkbox" id="reg-google-calendar" checked style="width: 18px; height: 18px;">
          <label for="reg-google-calendar" style="cursor: pointer;">連動 Google 行事曆 (選填)</label>
        </div>

        <button type="submit" class="pixel-btn" style="background: #51cf66; width: 100%; margin-top: 12px; padding: 10px;">
          完成註冊並進入專屬頁面 🚀
        </button>
      </form>
    </div>

    <!-- 2. 學員專屬頁面 -->
    <div id="student-view" style="display: none;">
      <!-- 教練簡介點擊區 -->
      <div class="pixel-box" style="background: #e7f5ff; margin-bottom: 12px; cursor: pointer;" onclick="openTrainerModal()">
        <span id="coach-name-tag" style="font-weight: bold; color: #1c7ed6;">專屬教練載入中...</span>
        <span style="float: right; font-size: 12px; text-decoration: underline;">查看教練簡介 🔍</span>
      </div>

      <!-- 第一區塊：最近一期上課資訊 -->
      <details class="pixel-block" open>
        <summary>
          <span>📅 1. 最近一期時間與地點</span>
          <span class="badge">最新預約</span>
        </summary>
        <div class="block-content" id="next-class-info"></div>
      </details>

      <!-- 第二區塊：期數與剩餘堂數 -->
      <details class="pixel-block" open>
        <summary>
          <span>📊 2. 期數 / 剩餘堂數 / 總堂數</span>
        </summary>
        <div class="block-content" id="packages-list"></div>
      </details>

      <!-- 第三區塊：Top 3 約課請求 -->
      <details class="pixel-block" open>
        <summary>
          <span>⏰ 3. 提交 Top 3 約課時間 (近30天)</span>
        </summary>
        <div class="block-content">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <input type="datetime-local" id="slot-1" class="form-input">
            <input type="datetime-local" id="slot-2" class="form-input">
            <input type="datetime-local" id="slot-3" class="form-input">
            <button class="pixel-btn" style="background: #51cf66;" onclick="submitBookingRequest()">送出約課申請</button>
          </div>
        </div>
      </details>

      <!-- 第四區塊：上課歷史紀錄 -->
      <details class="pixel-block" open>
        <summary>
          <span>📜 4. 上課歷史紀錄</span>
        </summary>
        <div class="block-content" id="class-history-list"></div>
      </details>
    </div>

    <!-- 3. 教練專屬頁面 -->
    <div id="trainer-view" style="display: none;">
      <h3>💪 教練管理專區</h3>
      <div class="pixel-box" style="background: #fff9db;">
        <h4>待處理約課請求</h4>
        <div id="requests-container">尚無待處理請求</div>
      </div>
    </div>
  </div>

  <!-- 個人資料視窗 (Modal) -->
  <div id="profile-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 style="margin-top:0;">👤 個人資料與設定</h3>
      <div id="profile-modal-body"></div>
      <div style="margin-top: 16px; border-top: 2px dashed #222; padding-top: 12px;">
        <label style="font-weight: bold; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="modal-calendar-toggle" onchange="toggleGoogleCalendarSetting(this.checked)">
          開啟 Google 行事曆自動連動
        </label>
      </div>
      <button class="pixel-btn" style="width: 100%; margin-top: 16px;" onclick="closeProfileModal()">關閉視窗</button>
    </div>
  </div>

  <!-- 教練簡介視窗 (Modal) -->
  <div id="trainer-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 style="margin-top:0;">🏋️ 教練詳細資料</h3>
      <div id="trainer-modal-body"></div>
      <button class="pixel-btn" style="width: 100%; margin-top: 16px;" onclick="closeTrainerModal()">關閉視窗</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      LIFF_ID: "2011857437-xFUbKdAg",
      GITHUB_TOKEN: "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",
      GITHUB_OWNER: "XavierCFS",
      GITHUB_REPO: "fitness-booking-app"
    };

    let allExpanded = true;
    let currentUserId = "";
    let dbData = {};
    let currentStudent = null;

    // 1. 初始化 LINE LIFF
    async function initLiff() {
      try {
        await liff.init({ liffId: CONFIG.LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        currentUserId = profile.userId;
      } catch (err) {
        console.warn("未在 LINE 環境中或測試模式，預設體驗測試");
        currentUserId = "U_TEST_USER_" + Math.floor(Math.random() * 1000); 
      }
      
      await loadGitHubDB();
      routeUser(currentUserId);
    }

    // 2. 讀取 GitHub JSON DB
    async function loadGitHubDB() {
      const url = `https://raw.githubusercontent.com/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/main/data/db.json?t=${Date.now()}`;
      try {
        const res = await fetch(url);
        dbData = await res.json();
      } catch (err) {
        console.error("載入資料庫失敗:", err);
      }
    }

    // 3. 寫回 GitHub DB
    async function updateGitHubDB(commitMessage) {
      const apiUrl = `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/contents/data/db.json`;
      try {
        const getRes = await fetch(apiUrl, {
          headers: { "Authorization": `Bearer ${CONFIG.GITHUB_TOKEN}` }
        });
        const fileMeta = await getRes.json();

        const jsonString = JSON.stringify(dbData, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${CONFIG.GITHUB_TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: commitMessage,
            content: base64Content,
            sha: fileMeta.sha
          })
        });

        return putRes.ok;
      } catch (err) {
        console.error("寫入 GitHub 失敗:", err);
        return false;
      }
    }

    // 4. 新學員註冊邏輯
    async function handleRegister(event) {
      event.preventDefault();

      const newStudent = {
        id: "stu_" + Date.now(),
        line_user_id: currentUserId,
        trainer_id: document.getElementById('reg-trainer').value,
        name: document.getElementById('reg-name').value,
        phone: document.getElementById('reg-phone').value,
        gender: document.getElementById('reg-gender').value,
        birthday: document.getElementById('reg-birthday').value,
        google_calendar_linked: document.getElementById('reg-google-calendar').checked,
        notes: []
      };

      dbData.students.push(newStudent);

      const isSaved = await updateGitHubDB(`新學員註冊：${newStudent.name}`);
      if (isSaved) {
        alert("🎉 註冊成功！歡迎進入專屬預約頁面。");
        document.getElementById('register-view').style.display = 'none';
        renderStudentView(newStudent);
      } else {
        alert("⚠️ 註冊儲存失敗，請再試一次。");
      }
    }

    // 5. 顯示學員專屬視角
    function renderStudentView(student) {
      currentStudent = student;
      document.getElementById('student-view').style.display = 'block';
      
      // 抬頭名稱（可點擊看個人資料）
      document.getElementById('user-greeting').innerHTML = `
        嗨！<span style="color: var(--pixel-primary); cursor: pointer; text-decoration: underline;" onclick="openProfileModal()">${student.name} 👤</span>
      `;

      const coach = dbData.trainers.find(t => t.id === student.trainer_id);
      document.getElementById('coach-name-tag').innerText = `🏋️ 專屬教練：${coach ? coach.nickname || coach.name : '未指定'}`;

      // 第一區塊：最近一期預約
      const nextLog = dbData.class_logs.find(l => l.student_id === student.id && l.status === 'scheduled');
      document.getElementById('next-class-info').innerHTML = nextLog ? `
        <p><strong>時間：</strong> ${nextLog.datetime}</p>
        <p><strong>地點：</strong> ${nextLog.location}</p>
        <p><strong>行事曆：</strong> ${nextLog.added_to_google_calendar ? '✅ 已同步' : '❌ 未同步'}</p>
      ` : '<p style="color:#888;">近期無已確認課程，請於下方提交 Top 3 預約時間！</p>';

      // 第二區塊：期數與堂數 (按期數升冪排序，FIFO 優先扣最早)
      const pkgs = dbData.packages
        .filter(p => p.student_id === student.id)
        .sort((a, b) => a.term_number - b.term_number);

      document.getElementById('packages-list').innerHTML = pkgs.map(p => `
        <div class="pixel-box" style="margin-bottom:8px; background:${p.remaining_lessons > 0 ? '#fff' : '#f1f3f5'};">
          <div style="display:flex; justify-content:space-between;">
            <strong>第 ${p.term_number} 期</strong>
            <span class="badge" style="background:${p.remaining_lessons > 0 ? '#40c057' : '#868e96'};">剩餘 ${p.remaining_lessons} / ${p.total_lessons} 堂</span>
          </div>
          <div style="font-size:12px; color:#666; margin-top:4px;">付款日: ${p.payment_date} (${p.payment_method})</div>
        </div>
      `).join('') || '<p style="color:#888;">尚無購買期數紀錄</p>';

      // 第四區塊：歷史紀錄
      const history = dbData.class_logs.filter(l => l.student_id === student.id && l.status === 'completed');
      document.getElementById('class-history-list').innerHTML = history.map(h => `
        <div style="border-bottom:1px dashed #ccc; padding:6px 0;">🕒 ${h.datetime} - ${h.location}</div>
      `).join('') || '<p style="color:#888;">尚無歷史紀錄</p>';
    }

    // 6. 用戶身分判斷與導向
    function routeUser(lineId) {
      const student = dbData.students.find(s => s.line_user_id === lineId);
      const trainer = dbData.trainers.find(t => t.line_user_id === lineId);

      if (student) {
        renderStudentView(student);
      } else if (trainer) {
        document.getElementById('trainer-view').style.display = 'block';
        document.getElementById('user-greeting').innerText = `教練好，${trainer.name}`;
      } else {
        // 新用戶 ➔ 開啟註冊表單
        document.getElementById('user-greeting').innerText = "歡迎！請先完成註冊";
        renderRegisterForm();
      }
    }

    // 7. 渲染註冊表單中的教練選項
    function renderRegisterForm() {
      document.getElementById('register-view').style.display = 'block';
      const trainerSelect = document.getElementById('reg-trainer');
      trainerSelect.innerHTML = dbData.trainers.map(t => `
        <option value="${t.id}">${t.nickname || t.name} (${t.experience.substring(0, 15)}...)</option>
      `).join('');
    }

    // Modal 控制：學員個人資料
    function openProfileModal() {
      if (!currentStudent) return;
      document.getElementById('profile-modal-body').innerHTML = `
        <p><strong>姓名：</strong> ${currentStudent.name}</p>
        <p><strong>電話：</strong> ${currentStudent.phone}</p>
        <p><strong>性別：</strong> ${currentStudent.gender === 'male' ? '男' : currentStudent.gender === 'female' ? '女' : '其他'}</p>
        <p><strong>生日：</strong> ${currentStudent.birthday}</p>
      `;
      document.getElementById('modal-calendar-toggle').checked = currentStudent.google_calendar_linked;
      document.getElementById('profile-modal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').style.display = 'none';
    }

    async function toggleGoogleCalendarSetting(checked) {
      if (currentStudent) {
        currentStudent.google_calendar_linked = checked;
        await updateGitHubDB(`更新 Google 行事曆連動設定: ${currentStudent.name}`);
      }
    }

    // Modal 控制：教練簡介
    function openTrainerModal() {
      if (!currentStudent) return;
      const coach = dbData.trainers.find(t => t.id === currentStudent.trainer_id);
      if (!coach) return;
      document.getElementById('trainer-modal-body').innerHTML = `
        <p><strong>教練姓名：</strong> ${coach.name} (${coach.nickname})</p>
        <p><strong>聯絡電話：</strong> ${coach.phone}</p>
        <p><strong>性別：</strong> ${coach.gender === 'male' ? '男' : '女'}</p>
        <p><strong>個人經歷/證照：</strong></p>
        <div class="pixel-box" style="background:#f8f9fa; font-size:13px;">${coach.experience}</div>
      `;
      document.getElementById('trainer-modal').style.display = 'flex';
    }

    function closeTrainerModal() {
      document.getElementById('trainer-modal').style.display = 'none';
    }

    // 全部展開 / 收納
    function toggleAllBlocks() {
      allExpanded = !allExpanded;
      document.querySelectorAll('.pixel-block').forEach(b => {
        if (allExpanded) b.setAttribute('open', '');
        else b.removeAttribute('open');
      });
      document.getElementById('toggle-all-btn').innerText = allExpanded ? '全部收納' : '全部展開';
    }

    initLiff();
  </script>
</body>
</html>
